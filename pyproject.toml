[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "retail-data-platform"
version = "1.0.0"
description = "End-to-end data warehouse and automated reporting platform (Airflow, dbt, Postgres, S3)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: needs a running Postgres (see docker-compose.yml)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
